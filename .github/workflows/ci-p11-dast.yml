name: P11 - DAST (ZAP baseline)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
     - "app/**"
     - ".github/workflows/ci-p11.yml"
     - "EVIDENCE/P11/**"


permissions:
  contents: read

jobs:
  dast-zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Wishlist API (fake DB for DAST)
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite://"
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8080 &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health || true; do sleep 1; done'

      - name: ZAP Baseline scan
        run: |
          docker run --rm --network host -u 0 -v "$PWD":/zap/wrk zaproxy/zap-stable \
            zap-baseline.py \
              -t http://localhost:8080/ \
              -r zap_baseline.html \
              -J zap_baseline.json \
              -d || true

          mv zap_baseline.* EVIDENCE/P11/ || true

      - name: Upload P11 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
