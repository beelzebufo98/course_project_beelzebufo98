name: Security - DAST (OWASP ZAP Baseline)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ci-p11-dast.yml"

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI (uvicorn) in background
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 >/tmp/uvicorn.log 2>&1 &

      - name: Wait for /health endpoint
        run: |
          echo "Waiting for http://localhost:8000/health..."
          for i in {1..20}; do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Ensure evidence directory
        run: mkdir -p EVIDENCE/P11

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/EVIDENCE/P11:/zap/wrk" \
            ghcr.io/zaproxy/zap-stable:2.15.0 zap-baseline.py \
              -t http://localhost:8000 \
              -r zap_baseline.html \
              -J zap_baseline.json || true

      - name: Upload DAST Evidence
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
