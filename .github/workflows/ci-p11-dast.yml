name: Security - DAST (OWASP ZAP Baseline)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ci-p11-dast.yml"

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast-zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Start FastAPI (uvicorn) in background
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 >/tmp/uvicorn.log 2>&1 &

      - name: Wait for /health endpoint
        run: |
          echo "Waiting for http://localhost:8000/health ..."
          for i in {1..20}; do
            curl -s http://localhost:8000/health && break
            sleep 2
          done

      - name: ZAP Baseline scan
        run: |
          docker run --rm --network host -u 0 -v "$PWD":/zap/wrk zaproxy/zap-stable \
            zap-baseline.py \
              -t http://localhost:8000/ \
              -r zap_baseline.html \
              -J zap_baseline.json \
              -d || true

          ls -la
          ls -la zap_baseline.* || true
          mv zap_baseline.* EVIDENCE/P11/ || true



      - name: Upload P11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
