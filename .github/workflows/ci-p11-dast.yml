name: Security - DAST (OWASP ZAP Baseline)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ci-p11-dast.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'


      - name: Ensure evidence directory
        run: mkdir -p EVIDENCE/P11

      - name: Run ZAP Baseline
        run: |
          docker run --rm --network host -u 0 -v "$PWD":/zap/wrk zaproxy/zap-stable \
            zap-baseline.py \
              -t http://localhost:8000/ \
              -r zap_baseline.html \
              -J zap_baseline.json \
              -d || true

          mv zap_baseline.* EVIDENCE/P11/ || true

      - name: Upload P11 Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
