name: Security - DAST (OWASP ZAP Baseline)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ci-p11-dast.yml"

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      app:
        image: python:3.11-slim
        ports:
          - "8000:8000"
        options: >-
          --health-cmd="curl -s http://localhost:8000/health || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
        volumes:
          - ${{ github.workspace }}:/workspace
        command: >
          bash -c "
            pip install -r /workspace/requirements.txt &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000
          "

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence directory
        run: mkdir -p EVIDENCE/P11

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app service..."
          for i in {1..20}; do
            curl -s http://localhost:8000/health && break
            sleep 3
          done

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            -v "$PWD/EVIDENCE/P11:/zap/wrk" \
            --network ${{ job.container.network }} \
            owasp/zap2docker-stable zap-baseline.py \
              -t http://app:8000 \
              -r zap_baseline.html \
              -J zap_baseline.json || true

      - name: Upload DAST Evidence
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
